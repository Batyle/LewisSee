name: Scheduled attendance absences

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-attendance-absences
  cancel-in-progress: false

jobs:
  mark-absences:
    runs-on: ubuntu-latest
    steps:
      - name: Mark absences and send notifications
        env:
          ATTENDANCE_API_URL: ${{ vars.ATTENDANCE_API_URL || 'https://lewissee.onrender.com/attendance' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the CRON_SECRET repository secret and matching attendance API environment variable."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${ATTENDANCE_API_URL%/}/absences"
